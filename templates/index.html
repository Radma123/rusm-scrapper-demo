<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RusM Scrapper — Поиск запчастей для сельхозтехники</title>
  <meta name="description" content="Интеллектуальный поиск запчастей на Rusmarket, Avito, Ozon и Автопитер" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <header class="header">
    <a href="/">
      <h1>RusM Scrapper</h1>
    </a>
    
    <form id="search-form" class="search-bar" role="search">
      <input
        id="query"
        type="search"
        name="q"
        placeholder="Артикул или название запчасти…"
        autocomplete="off"
        required
      />
      <button type="submit" id="submit-btn">Найти</button>
    </form>
    
    <div class="toolbar">
      <div class="toolbar__group">
        <span class="toolbar__label">Вид:</span>
        <label class="view-toggle">
          <input type="radio" name="view" value="grid" checked />
          Сетка
        </label>
        <label class="view-toggle">
          <input type="radio" name="view" value="list" />
          Список
        </label>
        <label class="view-toggle">
          <input type="radio" name="view" value="platforms" />
          По платформам
        </label>
      </div>
      <div class="toolbar__group">
        <label class="toolbar__label" for="sort">Сортировка:</label>
        <select id="sort" name="sort">
          <option value="price_asc" selected>Цена ↑</option>
          <option value="price_desc">Цена ↓</option>
          <option value="title_asc">Название А–Я</option>
          <option value="title_desc">Название Я–А</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <p id="status" class="status" hidden></p>
    <div id="results" class="results results--grid"></div>
  </main>

  <script src="/static/js/app.js" defer></script>
</body>
</html>
